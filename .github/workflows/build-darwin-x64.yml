name: 'Build xPack OpenOCD darwin-x64'

on:
  workflow_dispatch:
    # https://docs.github.com/en/actions/using-workflows/workflow-syntax-for-github-actions#onworkflow_dispatchinputs
    inputs:
      version:
        description: 'The semver of the release'
        required: false
        type: string
        default: 'current'
      xpm_version:
        description: 'The version of xpm to install'
        required: false
        type: string
        default: 'next'
      xpm_install_loglevel:
        description: 'Optional loglevel for xpm install'
        required: false
        default: 'info'
        type: choice
        options:
        - silent
        - warn
        - info
        - verbose
        - debug
        - trace
      xpm_install_options:
        description: 'Optional switches to pass to xpm install'
        required: false
        type: string
        default: ''
      helper-git-ref:
        description: 'The helper branch, tag or SHA to checkout'
        required: false
        default: 'xpack-development'

jobs:
  darwin-x64-build:
    name: 'darwin-x64 openocd ${{github.event.inputs.version}} build'
    timeout-minutes: 2880 # 2 days
    runs-on: macos-15-intel
    env:
      XBB_ENVIRONMENT_MACOSX_DEPLOYMENT_TARGET: '11.0'
    steps:
      - name: 'Show environment'
        run: |
          uname -a
          sw_vers
          df -gH /
          ls -lA /Library/Developer/CommandLineTools/SDKs || true
          ls -lA /Applications
          xcode-select --print-path
          xcodebuild -version || true
          pkgutil --pkg-info=com.apple.pkg.CLTools_Executables || true
          ls -l /Library/Developer/CommandLineTools/usr/include || true
          echo "pwd: $(pwd)"
          echo "whoami: $(whoami)"
          ls -lLA
          env | sort | grep -E '^[^ \t]+='

      - name: 'Remove Homebrew'
        uses: xpack/remove-homebrew-action@v1

      - name: 'Install Python packages'
        run: |
          pip3 install distlib

      - name: 'Setup Node.js'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          check-latest: true

      - name: 'Install xpm'
        timeout-minutes: 1440
        run: |
          npm install --location=global xpm@${{github.event.inputs.xpm_version}}

      - name: 'Verify Node.js, npm and xpm'
        run: |
          echo "$(which node): $(node --version)"
          echo "$(which npm): $(npm --version)"
          echo "$(which xpm): $(xpm --version)"

      - name: 'Clean working area' # Mandatory for self-hosted runners.
        run: |
          chmod -Rf a+w * || true
          rm -rf * .git*

      # https://github.com/actions/checkout
      - name: 'Checkout project'
        uses: actions/checkout@v1 # v1 for old Git
        with:
          fetch-depth: 3

      - name: 'Build darwin-x64 binaries'
        timeout-minutes: 1440
        run: |
          xpm install --loglevel ${{github.event.inputs.xpm_install_loglevel}} ${{github.event.inputs.xpm_install_options}} -C build-assets
          xpm install --config darwin-x64 --loglevel ${{github.event.inputs.xpm_install_loglevel}} ${{github.event.inputs.xpm_install_options}} -C build-assets
          xpm run build --config darwin-x64 -C build-assets

      - name: 'Show results'
        run: |
          ls -l build-assets/build/darwin-x64/application
          ls -l build-assets/build/darwin-x64/deploy

      - name: Upload platform artefacts
        uses: actions/upload-artifact@v4
        with:
          name: deploy-darwin-x64
          path: ${{github.workspace}}/build-assets/build/darwin-x64/deploy/*
          overwrite: true

      - name: 'Publish pre-release'
        # https://github.com/ncipollo/release-action
        uses: ncipollo/release-action@v1.21.0
        with:
          allowUpdates: true
          artifacts: 'build-assets/build/darwin-x64/deploy/*'
          bodyFile: '.github/workflows/body-github-pre-releases-test.md'
          commit: 'master'
          draft: false
          name: 'Test binaries'
          omitBodyDuringUpdate: true
          omitDraftDuringUpdate: true
          omitNameDuringUpdate: true
          owner: 'xpack-dev-tools'
          prerelease: true
          replacesArtifacts: true
          repo: 'pre-releases'
          tag: 'test'
          token: ${{secrets.PUBLISH_TOKEN}}

  darwin-x64-test:
    name: 'darwin-x64 openocd ${{github.event.inputs.version}} test'
    # https://github.com/actions/runner-images/blob/main/images/macos/macos-15-Readme.md
    runs-on: macos-15-intel
    needs: [darwin-x64-build]

    steps:
      - name: 'Show environment'
        run: |
          uname -a
          sw_vers
          df -gH /
          ls -lA /Library/Developer/CommandLineTools/SDKs || true
          ls -lA /Applications
          xcode-select --print-path
          xcodebuild -version || true
          pkgutil --pkg-info=com.apple.pkg.CLTools_Executables || true
          clang++ -v
          echo "whoami: $(whoami)"
          echo "pwd: $(pwd)"
          ls -lLA
          env | sort | grep -E '^[^ \t]+='

      - name: 'Remove Homebrew'
        uses: xpack/remove-homebrew-action@v1

      # https://github.com/actions/checkout
      - name: 'Checkout project'
        uses: actions/checkout@v5
        with:
          fetch-depth: 3

      - name: 'Checkout helper ${{github.event.inputs.helper-git-ref}}'
        uses: actions/checkout@v5
        with:
          repository: xpack-dev-tools/xbb-helper-xpack
          path: build-assets/xpacks/@xpack-dev-tools/xbb-helper
          ref: ${{github.event.inputs.helper-git-ref}}
          fetch-depth: 3

      - name: 'Run ${{github.event.inputs.version}} native test'
        run: bash build-assets/scripts/test.sh --version ${{github.event.inputs.version}} --base-url pre-release
