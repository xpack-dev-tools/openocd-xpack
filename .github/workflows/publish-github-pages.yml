# https://github.com/xpack-dev-tools/openocd-xpack/actions/workflows/publish-github-pages.yml

# Workflow for deploying static content to GitHub Pages.
name: GitHub Pages

# https://docs.github.com/en/actions/using-workflows/workflow-syntax-for-github-actions
# https://docs.github.com/en/actions/using-workflows/events-that-trigger-workflows

on:
  # Runs on pushes, if all conditions are met:
  push:
    # ... on the `website` branch ...
    branches:
      - 'website'
    # ... skip tags only ...
    tags-ignore:
      - '**'
    # ... any of these files changes ...
    paths:
      - 'website/**'
      - '**/tsconfig*.json'
      - 'src/**/*.ts'
      - 'README.md'
      - '.github/workflows/publish-github-pages.yml'
      - 'package.json'
      - 'build-assets/package.json'

  # Allows you to run this workflow manually from the Actions tab.
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment.
# https://docs.github.com/en/actions/using-jobs/using-concurrency
concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  # Single deploy job since we're just deploying.
  deploy:
    environment:
      name: github-pages
      url: ${{steps.deployment.outputs.page_url}}
    # https://github.com/actions/runner-images
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        # https://github.com/actions/checkout
        uses: actions/checkout@v6.0.2
        with:
          # The full history, required to compute lastUpdatedAt
          fetch-depth: 0

      - name: Use Nodejs
        # https://github.com/actions/setup-node
        uses: actions/setup-node@v6.4.0
        with:
          # Node LTS version.
          node-version: 24

      - name: Install dependencies
        run: npm --prefix website ci

      - name: Build the Docusaurus site
        run: npm --prefix website run build

      - name: Setup Pages
        # https://github.com/actions/configure-pages
        uses: actions/configure-pages@v6.0.0

      - name: Upload Pages artifact
        # https://github.com/actions/upload-pages-artifact
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          # Upload entire website
          path: './website/build'

      - name: Deploy to GitHub Pages
        id: deployment # referred by environment above, to get the URL.
        # https://github.com/actions/deploy-pages
        uses: actions/deploy-pages@v5.0.0
        with:
          artifact_name: github-pages
