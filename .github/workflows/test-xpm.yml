name: 'Test xPack OpenOCD via xpm'

on:
  workflow_dispatch:
    inputs:
      package-version:
        description: 'The semver of the npm release'
        required: false
        default: 'test'
      version:
        description: 'The GitHub release version'
        required: false
        default: 'current'
      helper-git-ref:
        description: 'The helper branch, tag or SHA to checkout'
        required: false
        default: 'xpack-development'

jobs:


  win32-x64-test:
    name: 'win32-x64 OpenOCD@${{github.event.inputs.version}} test'
    runs-on: windows-2025
    defaults:
      run:
        # https://docs.github.com/en/actions/using-workflows/workflow-syntax-for-github-actions#jobsjob_idstepsshell
        shell: bash # for --

    steps:
      - name: 'Show environment'
        run: |
          uname -a
          systeminfo # lsb_release -sd
          echo "whoami: $(whoami)"
          echo "pwd: $(pwd)"
          ls -lLA
          env | sort | grep -E '^[^ \t]+='

      # https://github.com/actions/checkout
      - name: 'Checkout project'
        uses: actions/checkout@v5
        with:
          fetch-depth: 3

      - name: 'Checkout helper ${{github.event.inputs.helper-git-ref}}'
        uses: actions/checkout@v5
        with:
          repository: xpack-dev-tools/xbb-helper-xpack
          path: build-assets/xpacks/@xpack-dev-tools/xbb-helper
          ref: ${{github.event.inputs.helper-git-ref}}
          fetch-depth: 3

      - name: 'Move workspace to short path for MinGW compatibility'
        run: |
          echo Creating D:\t short name folder...
          mkdir D:\t

          echo Moving workspace to D:\t...
          robocopy "%GITHUB_WORKSPACE%" "D:\t" /E /MOVE /NFL /NDL /NJH /NJS /NC /NS

          if %ERRORLEVEL% LEQ 3 (
            echo ✓ Workspace successfully moved to D:\t
            dir D:\t
          ) else (
            echo ✗ Failed to move workspace, robocopy exit code: %ERRORLEVEL%
            exit /b 1
          )
        shell: cmd

      - name: 'Run ${{github.event.inputs.version}} xpm test'
        working-directory: D:\t
        # Run the test from the short path
        run: bash build-assets/scripts/test.sh --package-version ${{github.event.inputs.package-version}} --version ${{github.event.inputs.version}} --xpm





  darwin-x64-test:
    name: 'darwin-x64 OpenOCD@${{github.event.inputs.version}} test'
    runs-on: macos-15-intel

    steps:
      - name: 'Show environment'
        run: |
          uname -a
          sw_vers
          ls -lA /Library/Developer/CommandLineTools/SDKs || true
          ls -lA /Applications
          sudo xcode-select --switch /Applications/Xcode_16.4.app
          xcode-select --print-path
          xcodebuild -version || true
          pkgutil --pkg-info=com.apple.pkg.CLTools_Executables || true
          clang++ -v
          echo "whoami: $(whoami)"
          echo "pwd: $(pwd)"
          ls -lLA
          env | sort | grep -E '^[^ \t]+='

      - name: 'Remove Homebrew'
        uses: xpack/remove-homebrew-action@v1

      - name: 'Setup Node.js'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          check-latest: true

      - name: 'Verify Node.js and npm'
        run: |
          echo "$(which node): $(node --version)"
          echo "$(which npm): $(npm --version)"

      - name: 'Clean working area' # Mandatory for self-hosted runners.
        run: |
          chmod -Rf a+w * || true
          rm -rf * .git*

      # https://github.com/actions/checkout
      - name: 'Checkout project'
        uses: actions/checkout@v5
        with:
          fetch-depth: 3

      - name: 'Checkout helper ${{github.event.inputs.helper-git-ref}}'
        uses: actions/checkout@v5
        with:
          repository: xpack-dev-tools/xbb-helper-xpack
          path: build-assets/xpacks/@xpack-dev-tools/xbb-helper
          ref: ${{github.event.inputs.helper-git-ref}}
          fetch-depth: 3

      - name: 'Run ${{github.event.inputs.version}} xpm test'
        run: bash build-assets/scripts/test.sh --package-version ${{github.event.inputs.package-version}} --version ${{github.event.inputs.version}} --xpm





